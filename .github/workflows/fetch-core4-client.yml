name: Fetch Core4 Client (Small Files)
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Download installer from release
        run: |
          curl -L --fail --retry 3 -o ryzomcore4_install.7z \
            "https://github.com/blazer2k1/ryzom-assets-storage/releases/download/core4-v1.0/ryzomcore4_install_7_linux64.7z"
          ls -lh ryzomcore4_install.7z

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Extract installer
        run: |
          7z x ryzomcore4_install.7z -o./ -y
          du -sh . --exclude=.git

      - name: Remove files over 100 MB
        run: |
          find . -type f -size +100M -not -path "./.git/*" -print -delete
          du -sh . --exclude=.git

      - name: Commit in size-batched pushes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          BATCH_SIZE=$((1500 * 1024 * 1024))   # 1.5 GB per push
          current=0
          batch=0
          list="/tmp/batch_files.txt"
          : > "$list"

          # Find all files we want to commit, excluding .git and the workflow itself
          find . -type f \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -not -name "ryzomcore4_install.7z" \
            | sort | while read -r f; do
            size=$(stat -c%s "$f")
            if [ $((current + size)) -gt $BATCH_SIZE ] && [ -s "$list" ]; then
              echo "=== Committing batch $batch (size: $current) ==="
              xargs -a "$list" git add --
              git commit -m "Add Core4 client assets - batch $batch" || true
              git push || echo "Push batch $batch failed"
              batch=$((batch + 1))
              current=0
              : > "$list"
            fi
            echo "$f" >> "$list"
            current=$((current + size))
          done

          # Flush the last batch
          if [ -s "$list" ]; then
            echo "=== Committing final batch $batch (size: $current) ==="
            xargs -a "$list" git add --
            git commit -m "Add Core4 client assets - batch $batch (final)" || true
            git push || echo "Final push failed"
          fi

          echo "--- Done ---"
          git log --oneline | head -20

      - name: Cleanup
        if: always()
        run: rm -f ryzomcore4_install.7z
