name: Release Core4 Large Files
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Download installer from release
        run: |
          curl -L --fail --retry 3 -o ryzomcore4_install.7z \
            "https://github.com/blazer2k1/ryzom-assets-storage/releases/download/core4-v1.0/ryzomcore4_install_7_linux64.7z"
          ls -lh ryzomcore4_install.7z

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Extract only large files
        run: |
          mkdir -p large-files
          # Extract each specific file over 100 MB
          for f in \
            "data/r2_lakes_maps.bnp" \
            "data/tryker_zones.bnp" \
            "data/r2_lakes_zones.bnp" \
            "data/r2_jungle_maps.bnp" \
            "data/r2_forest_zones.bnp" \
            "data/zorai_zones.bnp" \
            "data/r2_forest_maps.bnp" \
            "data/matis_zones.bnp" \
            "data/r2_jungle_zones.bnp" \
            "data/fauna_maps.bnp" \
            "data/characters_maps_zo_hom_armor00_hr.bnp" \
            "data/r2_desert_maps.bnp" \
            "data/r2_roots_zones.bnp" \
            "data/r2_roots_maps.bnp" \
            "data/characters_maps_zo_hof_armor00_hr.bnp" \
            "data/characters_maps_zo_hom_armor01_hr.bnp" \
            "data/r2_desert_zones.bnp" \
            "data/characters_maps_zo_hof_civil01_hr.bnp" \
            "data/characters_maps_tr_hom_civil01_hr.bnp" ; do
            7z x ryzomcore4_install.7z "$f" -olarge-files/ -y
          done
          ls -lh large-files/data/
          du -sh large-files

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create core4-large-v1.0 \
            --title "Ryzom Core4 Large Client Files" \
            --notes "BNP files over 100MB from the Core4 client installer" \
            large-files/data/*.bnp

      - name: Cleanup
        if: always()
        run: rm -f ryzomcore4_install.7z
